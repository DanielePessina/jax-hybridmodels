[project]
name = "jax-hybridmodels"
version = "0.3.0"
description = "Hybrid ODE and neural models in JAX"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Daniele Pessina", email = "daniele.pessina18@imperial.ac.uk" }
]
keywords = ["jax", "diffrax", "equinox", "hybrid models", "neural ODE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "diffrax>=0.7.0",
    "equinox>=0.13.7",
    "evosax>=0.2.0",
    "flax>=0.12.1,<0.12.9",
    "jax>=0.10.0,<0.11",
    "jaxkan>=0.3.7",
    "jaxlib>=0.10.0,<0.11",
    "jaxtyping>=0.3.0",
    "numpy>=2.3",
    "optax>=0.2.6",
    "rich>=13.0",
    "scipy>=1.16",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2.3"]
examples = [
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "python-libsbml>=5.20.4",
    "rlax>=0.1.9",
    "sympy>=1.14",
]

[project.urls]
Homepage = "https://github.com/DanielePessina/jax-hybridmodels"
Documentation = "https://danielepessina.github.io/jax-hybridmodels/"
Repository = "https://github.com/DanielePessina/jax-hybridmodels"
Issues = "https://github.com/DanielePessina/jax-hybridmodels/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel ships only the package (packages = src/jaxhybridmodels). The sdist
# ships source + docs/examples markdown and scripts, but deliberately not
# the dependency tree, build artifacts, figures, or large data files. The docs
# site's figures live in the repository and are not needed to install or test.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/docs/**/*.md",
    "/docs/.vitepress/config.ts",
    "/docs/package.json",
    "/examples/**/*.py",
    "/scripts/**/*.py",
    "/tests/**/*.py",
]
exclude = [
    "/docs/node_modules",
    "/docs/.vitepress/cache",
    "/docs/.vitepress/dist",
    "/docs/public",
    "/docs/examples/assets",
    "/examples/**/__pycache__",
    "/examples/**/figures",
    "/examples/**/figures_rl",
    "/examples/**/artefacts",
    "/examples/**/data",
    "/tests/**/__pycache__",
    "/tests/__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jaxhybridmodels"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "ty>=0.0.34",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "rlax>=0.1.9",
    # tests cover experiments_from_dataframe and PredictionResult.to_dataframe
    "pandas>=3.0.2",
    "blackjax>=1.7.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# W605 catches an invalid escape in a docstring, which Python only warns about
# when it compiles the file.
select = ["E", "F", "I", "UP", "B", "W605"]
ignore = []

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: long-running example checks, run by the examples workflow with -m slow"]
