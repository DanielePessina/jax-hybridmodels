[project]
name = "hybridmodels"
version = "0.1.0"
description = "Hybrid ODE and neural models in JAX"
readme = "README.md"
authors = [
    { name = "Daniele Pessina", email = "daniele.pessina18@imperial.ac.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "diffrax>=0.7.2",
    "equinox>=0.13.7",
    "evosax>=0.2.0",
    "jax>=0.10.0",
    "jaxkan>=0.3.7",
    "jaxlib>=0.10.0",
    "jaxtyping>=0.3.9",
    "marimo>=0.23.4",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "optax>=0.2.8",
    "pandas>=3.0.2",
    "rich>=15.0.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
examples = [
    "matplotlib",
    "openpyxl",
    "rlax>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "ty>=0.0.34",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "rlax>=0.1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# marimo notebooks are not ordinary modules. A bare expression on the last
# line of a cell IS the cell's rendered output (B018), names are resolved
# across cells by the marimo runtime rather than lexically (F821), and the
# markdown tables embedded in prose cells carry alignment that reflowing to
# 100 columns would destroy (E501).
"examples/**/notebook*.py" = ["B018", "F821", "E501"]
