name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The examples extra brings pandas, sympy and libsbml, which ty needs
      # to resolve imports in examples/.
      - name: Install
        run: uv sync --frozen --extra examples --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run ty check src tests examples scripts

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Test
        run: uv run pytest -q --cov=jaxhybridmodels --cov-fail-under=90

  lowest-dependencies:
    # The floors in pyproject.toml are a promise, so they get run. --frozen in
    # the job above only ever tests the versions in uv.lock.
    name: Lowest allowed dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install --resolution lowest-direct -e . 'pytest>=9.0.3' 'pytest-cov>=7.1.0' 'pandas>=2.2.3' 'rlax>=0.1.9' 'blackjax>=1.7.1'

      - name: Test
        run: .venv/bin/python -m pytest -q

  package:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --frozen --python 3.12

      - name: Build distributions
        run: uv build

      - name: Validate distribution metadata
        run: uvx twine check dist/*

      - name: Install the wheel in a clean environment
        run: |
          wheel_env="${RUNNER_TEMP}/jaxhybridmodels-wheel"
          uv venv --python 3.12 "$wheel_env"
          uv pip install --python "$wheel_env/bin/python" dist/*.whl
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv run --python "$wheel_env/bin/python" --no-project python -c \
            "import jaxhybridmodels; from jaxhybridmodels import MLPPredictor; assert jaxhybridmodels.__version__ == '$version'"
