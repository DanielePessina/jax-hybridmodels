name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/gen_api_docs.py"
      - "pyproject.toml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one in-flight Pages deploy at a time; cancel any stale one when a
# new docs push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install jaxhybridmodels (editable, for docstring introspection)
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install VitePress
        run: npm ci --prefix docs

      - name: Verify generated API docs are in sync with docstrings
        run: npm --prefix docs run docs:check:api

      # ----- Build the static site, upload artifact for the deploy job ----- #

      - name: Build VitePress site
        run: npm --prefix docs run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
