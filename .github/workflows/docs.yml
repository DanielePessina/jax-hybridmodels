name: docs

# The docs site is rebuilt only when the head commit message contains one
# of two literal triggers:
#
#   [build docs] — verify the generated docs/api/*.md files match the
#                  current docstrings (fails fast if not), then deploy.
#                  Use this when you ran ``npm run docs:gen`` locally and
#                  committed the result yourself.
#
#   [regen docs] — regenerate docs/api/*.md from current docstrings,
#                  commit the result back to the branch (with [skip ci]
#                  to avoid a loop), then deploy. Use this when you only
#                  edited docstrings and don't want to re-run the
#                  generator locally.
#
# Routine pushes — even ones that touch ``docs/`` or ``src/`` — do not
# redeploy the site, so the public Pages URL only updates when you mean
# it to. ``workflow_dispatch`` keeps a manual escape hatch (it implies
# the [build docs] semantics: check, don't regen).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs write access to pages + id-token. The
# ``[regen docs]`` path additionally pushes a commit back to the branch,
# which requires ``contents: write``.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one in-flight Pages deploy at a time; cancel any stale one when a
# new docs push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch'
            || contains(github.event.head_commit.message, '[build docs]')
            || contains(github.event.head_commit.message, '[regen docs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required so the auto-commit step on [regen docs] can push
          # back to ``main``.
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install jaxhybridmodels (editable, for docstring introspection)
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install VitePress
        run: npm ci --prefix docs

      # ----- [regen docs] path: regenerate, commit back, then build ----- #

      - name: Regenerate API docs from docstrings
        if: contains(github.event.head_commit.message, '[regen docs]')
        run: npm --prefix docs run docs:gen

      - name: Commit regenerated API docs back to branch
        if: contains(github.event.head_commit.message, '[regen docs]')
        run: |
          if git diff --quiet -- docs/api; then
            echo "No API-doc changes; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/api
            git commit -m "docs: regenerate API reference from docstrings [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      # ----- [build docs] path (and workflow_dispatch): fail fast on stale ----- #

      - name: Verify generated API docs are in sync with docstrings
        if: ${{ !contains(github.event.head_commit.message, '[regen docs]') }}
        run: npm --prefix docs run docs:check:api

      # ----- Build the static site, upload artifact for the deploy job ----- #

      - name: Build VitePress site
        run: npm --prefix docs run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
