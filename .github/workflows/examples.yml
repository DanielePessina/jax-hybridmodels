name: examples

# Smoke-tests the example scripts so they do not silently rot. Fast
# examples run end to end, slow ones with a short step budget, and every
# example file is at least compiled (ci.yml lints and typechecks them).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --frozen --extra examples

      - name: Compile every example script
        run: |
          uv run python - <<'EOF'
          import ast
          import pathlib
          for p in pathlib.Path("examples").rglob("*.py"):
              if "__pycache__" in str(p):
                  continue
              ast.parse(p.read_text())
              print("compiled", p)
          EOF

      - name: Run the custom training loop example
        run: uv run python examples/custom_loop/train_custom_loop.py

      - name: Run the pendulum sanity example
        run: uv run python examples/pendulum/train_harmonic.py --no-plot

      - name: Run the SBML-style hybrid example
        run: uv run python examples/sbml_hybrid/train_sbml_hybrid.py

      - name: Run the neural polynomial kinetics example
        run: uv run python examples/supersaturation_poly/train_supersaturation_poly.py

      - name: Run the tubular reactor example (short)
        run: uv run python examples/tubular_reactor/train_tubular_reactor.py --steps 5 --no-plot

      - name: Run the hybrid ODE example (short)
        run: uv run python examples/hybrid_ode/train_hybrid_ode.py --steps 40 --no-plot

      - name: Run the slow example tests
        run: uv run pytest -q -m slow
