name: examples

# Smoke-tests the example scripts so they do not silently rot. Fast
# examples run end to end, slow ones with a short step budget, and every
# example file is at least compiled (ci.yml lints and typechecks them).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --frozen --extra examples

      - name: Compile every example script
        run: |
          uv run python - <<'EOF'
          import ast
          import pathlib
          for p in pathlib.Path("examples").rglob("*.py"):
              if "__pycache__" in str(p):
                  continue
              ast.parse(p.read_text())
              print("compiled", p)
          EOF

      - name: Run the custom training loop example
        run: uv run python examples/custom_loop/train_custom_loop.py

      - name: Run the pendulum sanity example
        run: uv run python examples/pendulum/train_harmonic.py --no-plot

      - name: Run the SBML-style hybrid example
        run: uv run python examples/sbml_hybrid/train_sbml_hybrid.py

      - name: Run the neural polynomial kinetics example
        run: uv run python examples/supersaturation_poly/train_supersaturation_poly.py

      - name: Run the tubular reactor example (short)
        run: uv run python examples/tubular_reactor/train_tubular_reactor.py --steps 5 --no-plot

      - name: Run the tubular reactor posterior example (short)
        run: uv run python examples/tubular_reactor/sample_tubular_reactor.py --warmup 10 --draws 10 --chains 2 --steps 5 --predict-draws 5

      - name: Run the shelf life example
        run: uv run python examples/shelf_life/shelf_life.py --no-plot

      - name: Run the identifiability example
        run: uv run python examples/identifiability/arrhenius.py

      - name: Run the multiple shooting example
        run: uv run python examples/multiple_shooting/oscillator.py --no-plot

      - name: Run the hybrid ODE example (short)
        run: uv run python examples/hybrid_ode/train_hybrid_ode.py --steps 40 --no-plot

      - name: Run the custom predictor example
        run: uv run python examples/custom_predictor/train_custom_predictor.py --no-plot

      - name: Run the mechanistic crystallisation example (short)
        run: uv run python examples/crystallisation/train_crystallisation_mechanistic.py --generations 5 --population-size 16 --no-plot

      - name: Run the kinetic crystallisation example (short)
        run: uv run python examples/crystallisation/train_kinetic.py --steps 20 --no-plot

      - name: Run the batch reactor example (short)
        run: uv run python examples/batch_reactor/train_hybrid.py --generations 5 --steps 20 --no-plot

      - name: Run the batch reactor baselines (short)
        run: uv run python examples/batch_reactor/compare_baselines.py --generations 3 --steps 20 --no-plot

      - name: Run the batch reactor RL example (short)
        run: uv run python examples/batch_reactor/train_rl_deactivation.py --updates 3 --baseline-steps 5 --no-plot

      - name: Run the slow example tests
        run: uv run pytest -q -m slow
